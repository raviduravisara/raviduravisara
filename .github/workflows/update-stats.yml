name: Update GitHub Stats Cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create output directory
        run: mkdir -p assets

      - name: Generate GitHub Stats Card
        uses: stats-organization/github-readme-stats-action@main
        with:
          card: stats
          options: "show_icons=true&count_private=true&include_all_commits=true&hide_border=true&bg_color=0D1117&title_color=0D7C6B&icon_color=0D7C6B&text_color=ffffff&rank_icon=github"
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages Card
        uses: stats-organization/github-readme-stats-action@main
        with:
          card: top-langs
          options: "layout=compact&hide_border=true&bg_color=0D1117&title_color=0D7C6B&text_color=ffffff&langs_count=8&hide=html,css,scss"
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push updated SVGs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/top-langs.svg
          git diff --cached --quiet || (
            git commit -m "chore: update GitHub stats cards [skip ci]" &&
            git pull --rebase origin main &&
            git push
          )
